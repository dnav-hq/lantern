# Hand-authored journeys for the Bible map's drawing slice (a later task —
# nothing draws from this file yet). docs/proposals/map-in-the-story.md §2.2
# concluded a journey line is honest only where the text itself lists the
# route or an editor has authored it from the text, and recommended a
# hand-authored table of about a dozen rather than an inference engine. This
# is that table.
#
# Every `from`/`to` is a place id: the URL-slug half of a `sl` field in
# public/map/places.json.gz (e.g. `sl: "a231f80/jericho-1"` -> id
# `jericho-1`), NEVER a display name — two different Jerichos (OT Tell
# es-Sultan vs NT Tell el-Alayiq) share a name but not an id, which is the
# whole point. scripts/build-journeys.mjs fails loudly if an id here doesn't
# exist in the shipped bundle.
#
# Every leg's `ref` is a citation in which BOTH place names occur, in a
# self-contained travel notice. A single verse (Numbers 33 is the clean
# case — one leg, one verse, no interpretation) is preferred; a short range
# is used where a Hebrew or Greek narrative spends 2-6 verses describing one
# continuous move without naming any other place in between. Where even that
# doesn't hold — the text is genuinely silent about the course between two
# named points — the leg is left OUT of `legs` and recorded in `gaps`
# instead, so the map draws it dotted rather than as a confident line.
#
# Sources, editorial calls, and what was left out: docs/proposals/journeys-data.md.

journeys:
