<title>Journal — History</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,ital,wght@8..60,0,400;8..60,0,500;8..60,0,600;8..60,1,400&display=swap"
/>

<style>
  :root {
    --ui-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --scripture-font: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --bg: #f4f0e8;
    --surface: #fbf9f4;
    --surface-2: #ece6da;
    --border: #e2dccf;
    --border-strong: #d8d0c0;
    --text: #201e1a;
    --text-muted: #6a6353;
    --text-faint: #938a77;
    --accent: #6b62d6;
    --accent-ink: #594fd1;
    --accent-weak: rgba(107, 98, 214, 0.11);
    --cat-observation: #6b62d6;
    --cat-historical: #3f8f5b;
    --cat-application: #b5732a;
    --cat-personal: #c05070;
    --cat-observation-ink: #594fd1;
    --cat-historical-ink: #316f47;
    --cat-application-ink: #8a5820;
    --cat-personal-ink: #a73c5b;
    --elev-2: 0 2px 6px rgba(20, 16, 8, 0.06), 0 8px 20px -6px rgba(20, 16, 8, 0.1);
    --elev-3: 0 6px 16px -4px rgba(20, 16, 8, 0.12), 0 20px 40px -12px rgba(20, 16, 8, 0.18);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  :root:not([data-theme='light']) {
    @media (prefers-color-scheme: dark) {
      --bg: #17140f;
      --surface: #211d17;
      --surface-2: #2b2620;
      --border: #38322a;
      --border-strong: #473f34;
      --text: #ece4d6;
      --text-muted: #a99f8e;
      --text-faint: #7a7264;
      --accent: #a49cf0;
      --accent-ink: #a49cf0;
      --accent-weak: rgba(164, 156, 240, 0.14);
      --cat-observation: #a49cf0;
      --cat-historical: #6fca8e;
      --cat-application: #e0a15e;
      --cat-personal: #e58aa4;
      --cat-observation-ink: #a49cf0;
      --cat-historical-ink: #6fca8e;
      --cat-application-ink: #e0a15e;
      --cat-personal-ink: #e58aa4;
      --elev-2: 0 2px 6px rgba(0, 0, 0, 0.3), 0 8px 20px -6px rgba(0, 0, 0, 0.45);
      --elev-3: 0 6px 16px -4px rgba(0, 0, 0, 0.4), 0 20px 40px -12px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme='dark'] {
    --bg: #17140f;
    --surface: #211d17;
    --surface-2: #2b2620;
    --border: #38322a;
    --border-strong: #473f34;
    --text: #ece4d6;
    --text-muted: #a99f8e;
    --text-faint: #7a7264;
    --accent: #a49cf0;
    --accent-ink: #a49cf0;
    --accent-weak: rgba(164, 156, 240, 0.14);
    --cat-observation: #a49cf0;
    --cat-historical: #6fca8e;
    --cat-application: #e0a15e;
    --cat-personal: #e58aa4;
    --cat-observation-ink: #a49cf0;
    --cat-historical-ink: #6fca8e;
    --cat-application-ink: #e0a15e;
    --cat-personal-ink: #e58aa4;
    --elev-2: 0 2px 6px rgba(0, 0, 0, 0.3), 0 8px 20px -6px rgba(0, 0, 0, 0.45);
    --elev-3: 0 6px 16px -4px rgba(0, 0, 0, 0.4), 0 20px 40px -12px rgba(0, 0, 0, 0.6);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html,
  body {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: var(--ui-font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    cursor: pointer;
    color: inherit;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: saturate(1.1) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 0;
  }
  .top-row {
    display: flex;
    align-items: center;
    padding: 0 4px 10px;
  }
  .top .tab {
    font-family: var(--scripture-font);
    font-weight: 600;
    font-size: 18px;
  }
  .theme-btn {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    font-size: 14px;
    display: grid;
    place-items: center;
    color: var(--text-muted);
  }

  /* controls: view toggle + category filter */
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 10px;
  }
  .seg {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 13px;
    border-radius: 999px;
    transition: color 150ms, background 150ms;
  }
  .seg button[aria-pressed='true'] {
    background: var(--surface);
    color: var(--accent-ink);
    box-shadow: var(--elev-2);
  }
  .filter {
    position: relative;
    margin-left: auto;
  }
  .filter-trigger {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 11px 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .filter-trigger .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--fdot, transparent);
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .filter-trigger .dot.all {
    background: conic-gradient(var(--cat-observation), var(--cat-historical), var(--cat-application), var(--cat-personal), var(--cat-observation));
    box-shadow: none;
  }
  .filter-menu {
    position: absolute;
    top: calc(100% + 7px);
    right: 0;
    z-index: 30;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 13px;
    box-shadow: var(--elev-3);
    padding: 5px;
    min-width: 176px;
    display: none;
  }
  .filter-menu.on {
    display: block;
  }
  .filter-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 9px 10px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    text-align: left;
  }
  .filter-opt:active {
    background: var(--surface-2);
  }
  .filter-opt .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--odot, transparent);
    flex: none;
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .filter-opt .dot.all {
    background: conic-gradient(var(--cat-observation), var(--cat-historical), var(--cat-application), var(--cat-personal), var(--cat-observation));
    box-shadow: none;
  }
  .filter-opt .check {
    margin-left: auto;
    color: var(--accent-ink);
    font-weight: 700;
    opacity: 0;
  }
  .filter-opt[aria-selected='true'] .check {
    opacity: 1;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 20px 20px calc(40px + env(safe-area-inset-bottom));
  }
  .masthead {
    margin-bottom: 8px;
  }
  .masthead p {
    font-family: var(--scripture-font);
    font-style: italic;
    font-size: 15px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.5;
    max-width: 46ch;
  }

  .bucket {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 4px;
  }
  .bucket .lbl {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }
  .bucket .rule {
    height: 1px;
    background: var(--border);
    flex: 1;
  }

  /* a study group */
  .study {
    padding: 12px 0 6px;
    border-bottom: 1px solid var(--border);
  }
  .study-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 2px;
    text-align: left;
    border-radius: 7px;
  }
  .study-head:active {
    background: var(--surface-2);
  }
  .study-head .ref {
    font-family: var(--scripture-font);
    font-weight: 600;
    font-size: 20px;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .study-head .when {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-faint);
    white-space: nowrap;
  }
  .study-head .count {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  /* compact chapters view extras */
  .dots {
    display: inline-flex;
    gap: 3px;
    margin-right: 2px;
  }
  .dots .d {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  /* notes list within a study */
  .jnotes {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .jnote {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    padding: 7px 0 7px 11px;
    border-left: 2px solid var(--nrail, var(--border-strong));
  }
  .jnote[data-c='observation'] {
    --nrail: var(--cat-observation);
  }
  .jnote[data-c='historical'] {
    --nrail: var(--cat-historical);
  }
  .jnote[data-c='application'] {
    --nrail: var(--cat-application);
  }
  .jnote[data-c='personal'] {
    --nrail: var(--cat-personal);
  }
  .jnote .v {
    font-family: var(--ui-font);
    font-size: 11px;
    font-weight: 700;
    color: var(--nink, var(--accent-ink));
    padding-top: 4px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .jnote[data-c='observation'] .v {
    --nink: var(--cat-observation-ink);
  }
  .jnote[data-c='historical'] .v {
    --nink: var(--cat-historical-ink);
  }
  .jnote[data-c='application'] .v {
    --nink: var(--cat-application-ink);
  }
  .jnote[data-c='personal'] .v {
    --nink: var(--cat-personal-ink);
  }
  .jnote .t {
    font-family: var(--scripture-font);
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--text);
  }
  .more {
    border: 0;
    background: transparent;
    color: var(--accent-ink);
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 2px 4px 13px;
    text-align: left;
  }
</style>

<div class="top">
  <div class="top-row">
    <span class="tab">Journal</span>
    <button class="theme-btn" id="themeBtn" title="Light / dark">◐</button>
  </div>
  <div class="controls">
    <div class="seg" role="tablist" aria-label="View">
      <button data-view="notes" aria-pressed="true">Notes</button>
      <button data-view="chapters" aria-pressed="false">Chapters</button>
    </div>
    <div class="filter">
      <button class="filter-trigger" id="filterTrigger" aria-haspopup="true"></button>
      <div class="filter-menu" id="filterMenu" role="listbox"></div>
    </div>
  </div>
</div>

<main class="wrap">
  <header class="masthead">
    <p>A quiet record of where you've been reading, and what you noticed there.</p>
  </header>
  <div id="list"></div>
</main>

<script>
  const CATS = [
    ["all", "All notes"],
    ["observation", "Observation"],
    ["historical", "Historical"],
    ["application", "Application"],
    ["personal", "Personal"],
  ];
  const CAT_LABEL = Object.fromEntries(CATS);

  const STUDIES = [
    {
      ref: "John 15", bucket: "Today", when: "Today",
      notes: [
        { v: "15:2", c: "observation", t: "Pruning is done to the fruitful branch, not the dead one. Being cut back can be care, not rejection." },
        { v: "15:4", c: "personal", t: "Where am I trying to bear fruit on my own strength this week?" },
        { v: "15:5", c: "observation", t: "\"Apart from Me you can do nothing.\" Not less — nothing." },
        { v: "15:9", c: "personal", t: "\"Remain in My love.\" Not earn it, not reach for it. Remain." },
        { v: "15:13", c: "historical", t: "Laying down your life for your friends — spoken the night before He does exactly that." },
      ],
    },
    {
      ref: "Romans 8", bucket: "This week", when: "2 days ago",
      notes: [
        { v: "8:1", c: "observation", t: "No condemnation now. Present tense, already true." },
        { v: "8:28", c: "application", t: "All things work together for those who love Him. A covenant promise, not a blanket one." },
        { v: "8:38", c: "personal", t: "Paul lists everything that could separate us and none of it can. Nothing left out." },
      ],
    },
    {
      ref: "Psalm 23", bucket: "This week", when: "4 days ago",
      notes: [
        { v: "23:2", c: "personal", t: "He makes me lie down. Rest as something shepherded, not earned." },
        { v: "23:4", c: "personal", t: "Through the valley, not around it. The comfort is the presence, not the absence of the valley." },
      ],
    },
    {
      ref: "Philippians 4", bucket: "Earlier this month", when: "Aug 12",
      notes: [
        { v: "4:5", c: "observation", t: "\"The Lord is near\" sits between rejoice and do not be anxious. The nearness is the reason." },
        { v: "4:6", c: "application", t: "Prayer with thanksgiving. Gratitude before the answer." },
        { v: "4:11", c: "personal", t: "Contentment is learned, not felt. That's oddly freeing." },
        { v: "4:13", c: "historical", t: "\"I can do all things\" is about contentment in plenty and want, not achievement." },
      ],
    },
    {
      ref: "John 1", bucket: "Earlier this month", when: "Aug 9",
      notes: [
        { v: "1:1", c: "historical", t: "In the beginning — John deliberately echoes Genesis 1." },
        { v: "1:14", c: "observation", t: "The Word became flesh and dwelt — 'tabernacled' — among us." },
      ],
    },
    {
      ref: "Genesis 1", bucket: "Earlier this month", when: "Aug 5",
      notes: [{ v: "1:3", c: "observation", t: "\"And God said.\" Creation by speech. Order spoken into formlessness." }],
    },
    {
      ref: "Matthew 5", bucket: "Older", when: "Jul 28",
      notes: [
        { v: "5:3", c: "observation", t: "Poor in spirit — blessed are the ones who know they have nothing." },
        { v: "5:4", c: "personal", t: "Blessed are those who mourn. Not 'cheer up' — 'you will be comforted.'" },
        { v: "5:8", c: "application", t: "Pure in heart — singleness, not sinlessness. One love, undivided." },
        { v: "5:14", c: "observation", t: "You ARE the light. Not 'try to be.' Identity before instruction." },
        { v: "5:44", c: "application", t: "Love your enemies — and He means Rome, occupying their streets." },
        { v: "5:48", c: "historical", t: "\"Be perfect\" — teleios, complete or mature, not flawless." },
      ],
    },
    {
      ref: "Isaiah 40", bucket: "Older", when: "Jul 21",
      notes: [
        { v: "40:1", c: "historical", t: "\"Comfort my people\" — said to exiles, before the exile ended." },
        { v: "40:31", c: "personal", t: "They will run and not grow weary. Waiting on the Lord as the source of strength." },
      ],
    },
  ];

  let view = "notes";
  let filter = "all";
  const expanded = new Set();
  const COLLAPSE_AT = 3;

  const list = document.getElementById("list");

  function render() {
    list.innerHTML = "";
    let lastBucket = null;
    STUDIES.forEach((s, si) => {
      const notes = filter === "all" ? s.notes : s.notes.filter((n) => n.c === filter);
      if (notes.length === 0) return;

      if (s.bucket !== lastBucket) {
        lastBucket = s.bucket;
        const b = document.createElement("div");
        b.className = "bucket";
        b.innerHTML = `<span class="lbl">${s.bucket}</span><span class="rule"></span>`;
        list.appendChild(b);
      }

      const study = document.createElement("div");
      study.className = "study";

      const noun = notes.length === 1 ? "note" : "notes";
      const uniqCats = [...new Set(notes.map((n) => n.c))];
      const dotsHtml = uniqCats.map((c) => `<span class="d" style="background:var(--cat-${c})"></span>`).join("");

      const head = document.createElement("button");
      head.className = "study-head";
      head.innerHTML =
        `<span class="ref">${s.ref}</span>` +
        (view === "chapters" ? `<span class="dots">${dotsHtml}</span>` : "") +
        `<span class="count">${notes.length} ${noun}</span>` +
        `<span class="when">${s.when}</span>`;
      head.onclick = () => flash(head);
      study.appendChild(head);

      if (view === "notes") {
        const isExp = expanded.has(si);
        const shown = isExp ? notes : notes.slice(0, COLLAPSE_AT);
        const box = document.createElement("div");
        box.className = "jnotes";
        shown.forEach((n) => {
          const el = document.createElement("div");
          el.className = "jnote";
          el.dataset.c = n.c;
          el.innerHTML = `<span class="v">${n.v}</span><span class="t">${n.t}</span>`;
          box.appendChild(el);
        });
        study.appendChild(box);
        if (notes.length > COLLAPSE_AT) {
          const btn = document.createElement("button");
          btn.className = "more";
          btn.textContent = isExp ? "Show less" : `Show ${notes.length - COLLAPSE_AT} more`;
          btn.onclick = () => {
            if (isExp) expanded.delete(si);
            else expanded.add(si);
            render();
          };
          study.appendChild(btn);
        }
      }
      list.appendChild(study);
    });
  }

  function flash(el) {
    el.style.background = "var(--surface-2)";
    setTimeout(() => (el.style.background = ""), 160);
  }

  // view toggle
  document.querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => {
      view = b.dataset.view;
      document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.view === view)));
      render();
    };
  });

  // filter dropdown
  const fTrigger = document.getElementById("filterTrigger");
  const fMenu = document.getElementById("filterMenu");
  fMenu.innerHTML = CATS.map(
    ([c, label]) =>
      `<button class="filter-opt" data-c="${c}" role="option"><span class="dot ${c === "all" ? "all" : ""}" style="${c === "all" ? "" : `background:var(--cat-${c})`}"></span>${label}<span class="check">✓</span></button>`
  ).join("");
  function renderFilter() {
    const label = filter === "all" ? "All" : CAT_LABEL[filter];
    fTrigger.innerHTML = `<span class="dot ${filter === "all" ? "all" : ""}" style="${filter === "all" ? "" : `background:var(--cat-${filter})`}"></span>${label}<span style="font-size:10px;opacity:.7;margin-left:1px">▾</span>`;
    fMenu.querySelectorAll(".filter-opt").forEach((o) => o.setAttribute("aria-selected", String(o.dataset.c === filter)));
  }
  fTrigger.onclick = (e) => {
    e.stopPropagation();
    fMenu.classList.toggle("on");
  };
  fMenu.querySelectorAll(".filter-opt").forEach((o) => {
    o.onclick = (e) => {
      e.stopPropagation();
      filter = o.dataset.c;
      expanded.clear();
      renderFilter();
      fMenu.classList.remove("on");
      render();
    };
  });
  document.addEventListener("click", () => fMenu.classList.remove("on"));

  document.getElementById("themeBtn").onclick = () => {
    const c = document.documentElement.getAttribute("data-theme");
    const dark = c ? c === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  };

  renderFilter();
  render();
</script>
