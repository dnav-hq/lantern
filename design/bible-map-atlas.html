<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lantern — the map as an atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens copied verbatim from src/assets/tokens.css (Berean light + dark),
         so the map is judged against the app's real colours and not a mood board.
         The `--atlas-*` values below are the only proposed ones. */
      :root {
        --bg: #f4f0e8;
        --surface: #fbf9f4;
        --surface-2: #ece6da;
        --border: #e2dccf;
        --border-strong: #d8d0c0;
        --text: #201e1a;
        --text-muted: #6a6353;
        --text-faint: #938a77;
        --accent: #6b62d6;
        --accent-ink: #594fd1;
        --accent-weak: rgba(107, 98, 214, 0.11);
        --accent-soft: rgba(107, 98, 214, 0.18);
        --on-accent: #ffffff;
        --cat-historical: #3f8f5b;
        --cat-historical-ink: #316f47;
        --cat-application-ink: #8a5820;
        --ui-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --scripture-font: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        --radius-sm: 7px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --elev-2: 0 2px 6px rgba(20, 16, 8, 0.06), 0 8px 20px -6px rgba(20, 16, 8, 0.1);
        --elev-3: 0 6px 16px -4px rgba(20, 16, 8, 0.12), 0 20px 40px -12px rgba(20, 16, 8, 0.18);
      }

      /* ── The proposed map palettes, one set per treatment ──
         a = parchment relief with hypsometric colour
         b = restrained monochrome relief in the app's warm neutrals
         c = flat vector atlas with terrain hatching                           */
      .t-a {
        --atlas-land: #efe5cd;
        --atlas-sea: #c8d6db;
        --atlas-sea-ink: #6d8792;
        --atlas-coast: #9c8f72;
        --atlas-ink: #3a3427;
        --atlas-muted: #7c7159;
        --atlas-hatch: rgba(94, 80, 52, 0.4);
        --atlas-relief: 0.85;
      }
      .t-b {
        --atlas-land: #f6f1e6;
        --atlas-sea: #dde3e4;
        --atlas-sea-ink: #77878c;
        --atlas-coast: #b3a58a;
        --atlas-ink: #201e1a;
        --atlas-muted: #6a6353;
        --atlas-hatch: rgba(106, 99, 83, 0.36);
        --atlas-relief: 0.42;
      }
      .t-c {
        --atlas-land: #f3ecdd;
        --atlas-sea: #dce5e8;
        --atlas-sea-ink: #6f8891;
        --atlas-coast: #a89a7d;
        --atlas-ink: #201e1a;
        --atlas-muted: #6a6353;
        --atlas-hatch: rgba(112, 98, 68, 0.42);
        --atlas-relief: 0;
      }

      .dark {
        --bg: #17140f;
        --surface: #211d17;
        --surface-2: #2b2620;
        --border: #38322a;
        --border-strong: #473f34;
        --text: #ece4d6;
        --text-muted: #a99f8e;
        --text-faint: #7a7264;
        --accent: #a49cf0;
        --accent-ink: #a49cf0;
        --accent-weak: rgba(164, 156, 240, 0.15);
        --accent-soft: rgba(164, 156, 240, 0.22);
        --on-accent: #17140f;
        --cat-historical: #5fbf92;
        --cat-historical-ink: #5fbf92;
        --cat-application-ink: #d79a55;
        --elev-2: 0 2px 6px rgba(0, 0, 0, 0.32), 0 10px 22px -8px rgba(0, 0, 0, 0.42);
        --elev-3: 0 8px 20px -6px rgba(0, 0, 0, 0.45), 0 24px 48px -16px rgba(0, 0, 0, 0.55);
      }
      /* Dark is where the three treatments stop being interchangeable, so each
         one is re-solved here rather than filtered. A hypsometric ramp has no
         honest dark counterpart — see the note under treatment (a). */
      .dark .t-a {
        --atlas-land: #2d2618;
        --atlas-sea: #1d2529;
        --atlas-sea-ink: #7e929b;
        --atlas-coast: #7d7054;
        --atlas-ink: #ece4d6;
        --atlas-muted: #b3a88f;
        --atlas-hatch: rgba(226, 213, 184, 0.3);
        --atlas-relief: 0.6;
      }
      .dark .t-b {
        --atlas-land: #211d17;
        --atlas-sea: #191f22;
        --atlas-sea-ink: #8b9ca2;
        --atlas-coast: #7f7460;
        --atlas-ink: #ece4d6;
        --atlas-muted: #a99f8e;
        --atlas-hatch: rgba(236, 228, 214, 0.26);
        --atlas-relief: 0.3;
      }
      .dark .t-c {
        --atlas-land: #221e18;
        --atlas-sea: #191f23;
        --atlas-sea-ink: #87999f;
        --atlas-coast: #857a63;
        --atlas-ink: #ece4d6;
        --atlas-muted: #a99f8e;
        --atlas-hatch: rgba(230, 219, 196, 0.3);
        --atlas-relief: 0;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--ui-font);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 20px 72px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 6px;
      }
      h1 {
        font-family: var(--scripture-font);
        font-weight: 600;
        font-size: 27px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-family: var(--scripture-font);
        font-weight: 600;
        font-size: 19px;
        margin: 0 0 4px;
      }
      h3 {
        font-family: var(--scripture-font);
        font-weight: 600;
        font-size: 16px;
        margin: 0 0 8px;
      }
      .sub {
        color: var(--text-muted);
        font-size: 14px;
        margin: 0;
        max-width: 74ch;
        line-height: 1.6;
      }
      .section {
        margin-top: 40px;
      }
      .section-head {
        margin-bottom: 16px;
      }
      .callout {
        margin-top: 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--cat-historical);
        border-radius: var(--radius-md);
        padding: 13px 16px;
        font-size: 13px;
        line-height: 1.65;
        color: var(--text-muted);
        max-width: 88ch;
      }
      .callout strong {
        color: var(--text);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        background: var(--surface-2);
        padding: 1px 4px;
        border-radius: 4px;
      }

      /* ── artboards ── */
      .rail {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .rail.is-dark {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 22px;
      }
      .phone {
        width: 390px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 18px 24px 20px;
        box-shadow: var(--elev-2);
        flex: none;
      }
      .rail.is-dark .phone {
        box-shadow: none;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .card-title {
        font-family: var(--scripture-font);
        font-size: 16px;
        font-weight: 600;
      }
      .card-kicker {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      .card-note {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-muted);
        margin: 10px 0 0;
      }
      .map-frame {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--atlas-land);
      }
      .map-frame svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .cost {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 11px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .chip {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .chip.ships {
        background: rgba(63, 143, 91, 0.13);
        color: var(--cat-historical-ink);
        border-color: rgba(63, 143, 91, 0.24);
      }
      .chip.costs {
        background: var(--surface-2);
        color: var(--cat-application-ink);
        border-color: var(--border-strong);
      }
      .desk {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: var(--elev-2);
        max-width: 1180px;
      }

      /* ── tables and notes ── */
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 980px;
        font-size: 13px;
        margin-top: 8px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--text-faint);
        font-weight: 600;
      }
      td.num {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr.is-pick td {
        background: var(--accent-weak);
      }
      .notes ul {
        margin: 0 0 16px;
        padding-left: 18px;
        color: var(--text-muted);
        font-size: 13.5px;
        line-height: 1.7;
        max-width: 82ch;
      }
      .notes strong {
        color: var(--text);
      }
      .q {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        margin-bottom: 12px;
        max-width: 82ch;
      }
      .q p {
        margin: 0 0 6px;
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--text-muted);
      }
      .q p:last-child {
        margin-bottom: 0;
      }
      .attrib {
        margin-top: 32px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 11.5px;
        line-height: 1.6;
        color: var(--text-faint);
      }

      /* ── map ink ──
         Every stroke is non-scaling, so widths below are screen pixels at any
         frame size; sizes that must scale (labels, markers) are multiplied by
         the frame's own units-per-pixel in JS. */
      .atlas [stroke] {
        vector-effect: non-scaling-stroke;
      }
      .atlas .coast {
        fill: none;
        stroke: var(--atlas-coast);
        stroke-width: 0.9;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .atlas .river {
        fill: none;
        stroke: var(--atlas-sea-ink);
        stroke-width: 0.7;
        stroke-linecap: round;
        opacity: 0.6;
      }
      .atlas .lake {
        fill: var(--atlas-sea);
        stroke: var(--atlas-sea-ink);
        stroke-width: 0.6;
        opacity: 0.9;
      }
      .atlas .hatch {
        fill: none;
        stroke: var(--atlas-hatch);
        stroke-width: 0.6;
        stroke-linecap: round;
      }
      .atlas .leg {
        fill: none;
        stroke: var(--accent-ink);
        stroke-width: 1.7;
        stroke-linecap: round;
      }
      .atlas .leg.is-dashed {
        stroke-dasharray: 3 3.4;
        opacity: 0.75;
      }
      .atlas .leg-shadow {
        fill: none;
        stroke: var(--atlas-land);
        stroke-width: 4.2;
        stroke-linecap: round;
        opacity: 0.85;
      }
      .atlas .stop-disc {
        fill: var(--accent-ink);
        stroke: var(--atlas-land);
        stroke-width: 1.4;
      }
      .atlas .stop-num {
        fill: var(--on-accent);
        font-family: var(--ui-font);
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .atlas .place-label {
        fill: var(--atlas-ink);
        font-family: var(--scripture-font);
        font-weight: 600;
        paint-order: stroke;
        stroke: var(--atlas-land);
        stroke-width: 3;
        stroke-linejoin: round;
        dominant-baseline: middle;
      }
      .atlas .region-label {
        fill: var(--atlas-muted);
        font-family: var(--scripture-font);
        font-variant-caps: all-small-caps;
        letter-spacing: 0.16em;
        text-anchor: middle;
        paint-order: stroke;
        stroke: var(--atlas-land);
        stroke-width: 2.6;
        stroke-linejoin: round;
      }
      .atlas .sea-label {
        fill: var(--atlas-sea-ink);
        font-family: var(--scripture-font);
        font-style: italic;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.18em;
        text-anchor: middle;
      }
      .atlas .furniture {
        fill: var(--atlas-muted);
        font-family: var(--ui-font);
      }
      .atlas .rule {
        stroke: var(--atlas-muted);
        stroke-width: 1;
        fill: none;
      }
      .atlas .neatline {
        fill: none;
        stroke: var(--atlas-coast);
        stroke-width: 1;
        opacity: 0.55;
      }

      /* ── the map's own legend, drawn in HTML under the frame ── */
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--text-muted);
      }
      .legend .item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend .swatch {
        width: 18px;
        height: 0;
        border-top: 2px solid var(--accent-ink);
        flex: none;
      }
      .legend .swatch.dash {
        border-top-style: dashed;
      }
      .legend .swatch.dot {
        width: 9px;
        height: 9px;
        border: 0;
        border-radius: 50%;
        background: var(--accent-ink);
      }
      .legend .swatch.hatch {
        width: 16px;
        height: 10px;
        border: 0;
        background: repeating-linear-gradient(
          62deg,
          var(--atlas-hatch) 0 1px,
          transparent 1px 4px
        );
      }
    </style>
  </head>

    <script>
      // ── the renderer ──
      //
      // One function draws a frame; a treatment is a set of CSS custom properties
      // plus two switches (does it paint a relief raster, does it hatch). That is
      // deliberate: if a treatment needed its own renderer, it would not be a
      // visual direction the built map could switch between.
      const TREATMENTS = {
        a: {
          key: 'a',
          name: 'Parchment relief',
          kicker: 'Treatment A',
          note: 'Hypsometric colour over the shaded relief, hairline coast, warm parchment land. The look of a printed study-Bible plate.',
          relief: 'hypsometric',
          hatch: false,
          cost: '≈ 213 KB per frame at phone size — and today’s grayscale relief cannot supply the colour',
          chip: ['costs', 'Needs a new source']
        },
        b: {
          key: 'b',
          name: 'Quiet relief',
          kicker: 'Treatment B',
          note: 'The relief we already ship, held back to a whisper and tinted into the app’s warm neutrals. The map recedes; the route is the only voice.',
          relief: 'mono',
          hatch: false,
          cost: '685 KB whole-world raster, already built and opt-in — 213 KB if cropped per frame',
          chip: ['ships', 'Ships today']
        },
        c: {
          key: 'c',
          name: 'Engraved atlas',
          kicker: 'Treatment C',
          note: 'No raster at all: land and sea from a 1-bit mask, terrain as hachures derived from the relief at build time, everything in theme ink.',
          relief: 'none',
          hatch: true,
          cost: '3.4 KB sea mask + 13.6 KB of hachures, gzipped — and the 685 KB raster stops shipping',
          chip: ['ships', 'Built from what we ship']
        }
      }

      /** Escape for the one place user-ish strings meet markup. */
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

      let uid = 0

      /**
       * Draw one frame at one width in one treatment.
       * `width` is the CSS width the SVG will occupy, which is what turns the
       * frame's own units into pixels — the same job `--map-k` does in the app.
       */
      function drawMap(frame, treatment, width) {
        const [vx, vy, vw, vh] = frame.viewBox
        const k = vw / width // frame units per CSS pixel
        const px = (n) => +(n * k).toFixed(2)
        const id = `f${++uid}`
        const out = []
        const t = TREATMENTS[treatment]

        out.push(
          `<svg class="atlas" viewBox="${vx} ${vy} ${vw} ${vh}" width="${width}" height="${Math.round(width * (vh / vw))}" role="img" aria-label="${esc(frame.title)} — ${esc(frame.caption)}">`
        )

        // defs: the sea mask, and the two relief recipes.
        out.push('<defs>')
        out.push(
          `<mask id="sea-${id}" maskUnits="userSpaceOnUse" x="${frame.relief.x}" y="${frame.relief.y}" width="${frame.relief.w}" height="${frame.relief.h}">` +
            `<image href="${frame.relief.mask}" x="${frame.relief.x}" y="${frame.relief.y}" width="${frame.relief.w}" height="${frame.relief.h}" preserveAspectRatio="none" image-rendering="optimizeQuality"/>` +
            '</mask>'
        )
        // A hypsometric ramp, as a per-channel transfer over the hillshade's own
        // luminance. Honest caveat, stated on the card too: luminance is not
        // elevation — this is what the colour WOULD do, drawn from the only
        // raster we ship. A real hypsometric plate needs an elevation source.
        out.push(
          `<filter id="hyp-${id}" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">` +
            '<feComponentTransfer>' +
            '<feFuncR type="table" tableValues="0.33 0.47 0.62 0.76 0.87 0.94 0.97"/>' +
            '<feFuncG type="table" tableValues="0.29 0.42 0.55 0.68 0.80 0.89 0.94"/>' +
            '<feFuncB type="table" tableValues="0.21 0.28 0.37 0.49 0.63 0.76 0.86"/>' +
            '</feComponentTransfer>' +
            '</filter>'
        )
        // The quiet treatment: the same grayscale, pushed towards the theme's ink
        // rather than pure grey, so it sits inside the palette instead of beside it.
        out.push(
          `<filter id="mono-${id}" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">` +
            '<feColorMatrix type="matrix" values="' +
            '0.62 0 0 0 0.36  0.58 0 0 0 0.33  0.50 0 0 0 0.27  0 0 0 1 0"/>' +
            '</filter>'
        )
        out.push('</defs>')

        // Land, then relief, then sea painted back over the raster's own water:
        // relief that bleeds into the sea is the single clearest tell of a map
        // that was assembled rather than drawn.
        out.push(`<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="var(--atlas-land)"/>`)
        if (t.relief !== 'none' && frame.relief.href) {
          const filter = t.relief === 'hypsometric' ? `url(#hyp-${id})` : `url(#mono-${id})`
          out.push(
            `<image href="${frame.relief.href}" x="${frame.relief.x}" y="${frame.relief.y}" width="${frame.relief.w}" height="${frame.relief.h}" preserveAspectRatio="none" filter="${filter}" opacity="var(--atlas-relief)"/>`
          )
        }
        if (t.hatch) {
          out.push(`<path class="hatch" d="${frame.hachures}"/>`)
        }
        out.push(
          `<rect x="${frame.relief.x}" y="${frame.relief.y}" width="${frame.relief.w}" height="${frame.relief.h}" fill="var(--atlas-sea)" mask="url(#sea-${id})"/>`
        )

        // Natural Earth ink: lakes, rivers, then the coast on top of both.
        for (const d of frame.layers.lakes) out.push(`<path class="lake" d="${d}"/>`)
        for (const d of frame.layers.rivers) out.push(`<path class="river" d="${d}"/>`)
        for (const d of frame.layers.coastline) out.push(`<path class="coast" d="${d}"/>`)

        // Sea and region names: the atlas voice. Regions are placed from their
        // point plus an editorial offset — see the note on region geometry.
        for (const s of frame.seas) {
          const size = s.size === 'small' ? 8.5 : 11
          out.push(
            `<text class="sea-label" x="${s.x}" y="${s.y}" font-size="${px(size)}" transform="rotate(${s.rotate || 0} ${s.x} ${s.y})">${esc(s.label)}</text>`
          )
        }
        for (const r of frame.regions) {
          out.push(
            `<text class="region-label" x="${r.x + r.dx * k}" y="${r.y + r.dy * k}" font-size="${px(11)}">${esc(r.label)}</text>`
          )
        }

        // The route: a halo in the land colour under each leg so it reads over
        // hatching and relief alike, then the leg, then the numbered stops.
        for (const leg of frame.legs) out.push(`<path class="leg-shadow" d="${leg.d}"/>`)
        for (const leg of frame.legs) {
          out.push(`<path class="leg${leg.dashed ? ' is-dashed' : ''}" d="${leg.d}"/>`)
        }
        for (const m of frame.marks) {
          out.push(`<circle class="stop-disc" cx="${m.x}" cy="${m.y}" r="${px(6.4)}"/>`)
          out.push(
            `<text class="stop-num" x="${m.x}" y="${m.y + 0.15 * k}" font-size="${px(8)}">${m.stop}</text>`
          )
        }
        for (const m of frame.marks) {
          out.push(
            `<text class="place-label" x="${m.x + m.dx * k}" y="${m.y + m.dy * k}" font-size="${px(11.5)}" text-anchor="${m.anchor}">${esc(m.label)}</text>`
          )
        }

        out.push(furniture(frame, k, px, vx, vy, vw, vh))
        out.push(
          `<rect class="neatline" x="${vx + 1.2 * k}" y="${vy + 1.2 * k}" width="${vw - 2.4 * k}" height="${vh - 2.4 * k}"/>`
        )
        out.push('</svg>')
        return out.join('')
      }

      /**
       * Scale bar and north mark. Both are computed, not drawn: the scale is
       * measured at the frame's own centre latitude (a conic projection's scale
       * is only true near its standard parallels), and north tilts with the
       * meridian, which is the detail that separates a map from a picture.
       */
      function furniture(frame, k, px, vx, vy, vw, vh) {
        const out = []
        const pad = 12 * k
        const barX = vx + pad
        const barY = vy + vh - pad
        const bar = frame.scale.units
        const h = 3.4 * k
        out.push('<g>')
        out.push(
          `<rect x="${barX}" y="${barY - h}" width="${bar}" height="${h}" fill="var(--atlas-muted)" opacity="0.18"/>`
        )
        out.push(
          `<path class="rule" d="M${barX},${barY} l0,${-h} l${bar / 2},0 l0,${h} l${bar / 2},0 l0,${-h}"/>`
        )
        out.push(
          `<text class="furniture" x="${barX}" y="${barY - h - 3.4 * k}" font-size="${px(9)}">0</text>`
        )
        out.push(
          `<text class="furniture" x="${barX + bar}" y="${barY - h - 3.4 * k}" font-size="${px(9)}" text-anchor="end">${frame.scale.km} km</text>`
        )

        const nx = vx + vw - pad - 5 * k
        const ny = vy + pad + 15 * k
        out.push(
          `<g transform="rotate(${frame.north} ${nx} ${ny})">` +
            `<path class="rule" d="M${nx},${ny} L${nx},${ny - 13 * k}" stroke-width="1.1"/>` +
            `<path d="M${nx},${ny - 15.5 * k} L${nx - 2.6 * k},${ny - 10.5 * k} L${nx + 2.6 * k},${ny - 10.5 * k} Z" fill="var(--atlas-muted)"/>` +
            `<text class="furniture" x="${nx}" y="${ny + 7 * k}" font-size="${px(9)}" text-anchor="middle">N</text>` +
            '</g>'
        )
        out.push('</g>')
        return out.join('')
      }

      const legend = (frame) =>
        '<div class="legend">' +
        '<span class="item"><span class="swatch"></span> Route in this chapter</span>' +
        '<span class="item"><span class="swatch dash"></span> Course not named in the text</span>' +
        '<span class="item"><span class="swatch dot"></span> Stop, in order</span>' +
        '<span class="item"><span class="swatch hatch"></span> Higher ground</span>' +
        `<span class="item">Scale at ${frame.scale.kmPerUnit ? Math.round(frame.scale.km) : ''} km · north is grid north</span>` +
        '</div>'

      function phoneCard(frame, key, width) {
        const t = TREATMENTS[key]
        return (
          `<div class="phone t-${key}">` +
          '<div class="card-head">' +
          `<span class="card-title">${t.name}</span><span class="card-kicker">${t.kicker}</span>` +
          '</div>' +
          `<div class="map-frame">${drawMap(frame, key, width)}</div>` +
          legend(frame) +
          `<p class="card-note">${t.note}</p>` +
          `<div class="cost"><span class="chip ${t.chip[0]}">${t.chip[1]}</span><span>${t.cost}</span></div>` +
          '</div>'
        )
      }

      const gal = FRAMES.frames.find((f) => f.id === 'galatians-1')
      const gen = FRAMES.frames.find((f) => f.id === 'genesis-12')
      const PHONE_MAP = 342

      document.getElementById('wrap').innerHTML = `
        <p class="eyebrow">Design ideation · not built</p>
        <h1>The map as a real atlas</h1>
        <p class="sub">
          Three ways the same Galatians 1 frame could look, at the width a phone
          actually gives it. Every coastline, lake, river and place below is the
          real shipped geometry — <code>public/map/base.json.gz</code> and
          <code>places.json.gz</code>, projected with the app’s own transform and
          exported by <code>scripts/export-map-frame.mjs</code>. Nothing here is
          drawn by hand, so what you are judging is what the map can actually do.
        </p>
        <div class="callout">
          <strong>The question this settles:</strong> how much of “a quality map”
          is colour and relief, and how much is ink, type and restraint. The
          treatments are ordered by what they cost: (a) needs a source we do not
          have, (b) uses the 685 KB relief we already built, (c) uses nothing we
          do not already ship.
        </div>

        <div class="section">
          <div class="section-head">
            <h2>Three treatments · Galatians 1 · 390 px</h2>
            <p class="sub">
              Paul’s own account of where he went after Damascus — Arabia, back to
              Damascus, up to Jerusalem, then Syria and Cilicia. Four numbered
              stops, two of them joined by a course the letter never describes.
            </p>
          </div>
          <div class="rail">
            ${phoneCard(gal, 'a', PHONE_MAP)}
            ${phoneCard(gal, 'b', PHONE_MAP)}
            ${phoneCard(gal, 'c', PHONE_MAP)}
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>The same three, dark</h2>
            <p class="sub">
              Dark is where they stop being interchangeable. A hypsometric ramp
              has no honest dark counterpart — inverting it turns a desert brown
              into a colour no atlas has ever printed — so (a) is re-solved by
              hand and still reads as a photograph of a different map. (c) simply
              takes the theme’s ink.
            </p>
          </div>
          <div class="rail is-dark dark">
            ${phoneCard(gal, 'a', PHONE_MAP)}
            ${phoneCard(gal, 'b', PHONE_MAP)}
            ${phoneCard(gal, 'c', PHONE_MAP)}
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>Desktop artboard · Genesis 12 · the recommended treatment</h2>
            <p class="sub">
              Abram’s journey out of Haran, at 1280 px with the study workbench
              beside it. The same renderer, the same treatment (c), a second real
              frame: more room buys label air and a longer scale bar, not more
              decoration.
            </p>
          </div>
          <div class="desk t-c">
            <div class="card-head">
              <span class="card-title">${gen.title} · ${gen.caption}</span>
              <span class="card-kicker">Engraved atlas · 1120 px map</span>
            </div>
            <div class="map-frame">${drawMap(gen, 'c', 1120)}</div>
            ${legend(gen)}
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>What each treatment costs</h2>
            <p class="sub">
              Measured, not estimated: every number below is printed by
              <code>npx tsx scripts/export-map-frame.mjs</code> against the shipped
              bundles. “Per frame” is one chapter’s view at phone size; the relief
              we ship today is one 1600×916 raster for the whole Bible world.
            </p>
          </div>
          <table>
            <thead>
              <tr>
                <th>Treatment</th>
                <th>New bytes over what ships</th>
                <th class="num">Phone frame</th>
                <th>Source, and its licence</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>a</strong> · Parchment relief</td>
                <td>A colour relief or elevation raster. The full-colour Natural
                Earth relief was measured at build time: 2,551 KB for the frame,
                4× the grayscale. Cropped per chapter at phone size it is 213 KB
                <em>each</em>, and it cannot be recoloured for 20 themes.</td>
                <td class="num">213 KB<br />per frame</td>
                <td>Natural Earth NE1 / HYP cross-blended hypsometric tints,
                public domain, no attribution required. Not currently downloaded
                by <code>build-map-data.mjs</code>.</td>
              </tr>
              <tr>
                <td><strong>b</strong> · Quiet relief</td>
                <td>None. <code>public/map/terrain.png</code> is already built and
                already opt-in: 685 KB, fetched only when relief is switched on.</td>
                <td class="num">685 KB once<br />(213 KB cropped)</td>
                <td>Natural Earth SR_50M shaded relief, public domain. Shipping
                today.</td>
              </tr>
              <tr class="is-pick">
                <td><strong>c</strong> · Engraved atlas</td>
                <td>3.4 KB sea mask + 13.6 KB of hachures (gzipped) for this
                frame, both <em>derived from the raster at build time</em> — so
                the 685 KB raster need never be fetched by a reader at all.</td>
                <td class="num">17 KB<br />per frame</td>
                <td>Derived from what we already ship. No new source, no new
                licence, no new download.</td>
              </tr>
            </tbody>
          </table>
          <div class="callout">
            <strong>Already in the payload, under every treatment:</strong>
            <code>base.json.gz</code> 59 KB (coastline, lakes, rivers for the whole
            frame) and <code>places.json.gz</code> 142 KB. The Galatians frame uses
            11.8 KB of that artwork; Genesis 12 uses 9.5 KB.
          </div>
        </div>

        <div class="section notes">
          <h2>What the mockup is arguing</h2>
          <ul>
            <li><strong>The atlas feeling is ink, not colour.</strong> Hairline
            coast, a serif place name, a region in small caps, a scale bar and a
            true north mark do more for “this is a real map” than a relief
            photograph does — compare (c) against (a) at this size.</li>
            <li><strong>Relief at phone size is mostly noise.</strong> The 685 KB
            hillshade resolves to about 340 px of screen. What survives the
            shrink is the texture, not the terrain — and the texture is what
            hachures draw for 13.6 KB.</li>
            <li><strong>A raster cannot be themed; ink can.</strong> (a) and (b)
            are colour-managed images sitting inside a themeable app. (c) is
            drawn in <code>currentColor</code> and is correct in all 20 themes by
            construction.</li>
            <li><strong>Honesty stays visible.</strong> The dashed leg is not a
            style choice: it is where Galatians never says which way he went.
            That distinction survives in all three treatments and must.</li>
            <li><strong>Two caveats this mockup does not hide.</strong> The
            colour in (a) is a luminance ramp over the hillshade — real
            hypsometric tints need an elevation source we do not ship. And region
            names (Syria, Canaan) are placed from OpenBible’s single point plus an
            editorial offset, because the polygons that would give a region its
            true shape are ODbL and deliberately excluded.</li>
          </ul>
        </div>

        <div class="section notes">
          <h2>Two decisions</h2>
          <div class="q">
            <h3>1 · Does the map paint its own palette, or the app’s?</h3>
            <p>
              (a) and (c) give the map a parchment-and-sea palette of its own: it
              looks like a map wherever it appears, and slightly like a guest in
              Lantern. (b) keeps the app’s neutrals: calmer, more of a piece, less
              map-like. The mockup recommends a middle — (c)’s palette, derived
              from theme tokens rather than fixed, so a parchment map in the light
              theme becomes an ink map in the dark one.
            </p>
          </div>
          <div class="q">
            <h3>2 · Does the 685 KB relief raster keep shipping?</h3>
            <p>
              If (c) is the direction, hachures replace relief for every reader and
              <code>terrain.png</code> becomes a build-time input rather than a
              download — the opt-in toggle and its 685 KB disappear from the
              product. The alternative is to keep it as a “relief” switch for the
              reader who wants the photograph. Keeping both costs a toggle, a
              second visual language, and the 685 KB.
            </p>
          </div>
        </div>

        <p class="attrib">
          ${esc(FRAMES.source.attribution.join(' · '))}. Geometry exported
          ${esc(FRAMES.generated)} by <code>scripts/export-map-frame.mjs</code> from
          the bundles in <code>public/map/</code>. See
          <code>docs/proposals/bible-map-atlas.md</code> for the recommendation.
        </p>
      `

    </script>
  </body>
</html>
