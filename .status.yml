name: Lantern
review_level: normal

checks:
  # The hourly health job only runs http_200 checks — a `command` check needs
  # the repo checked out and installed, which is too heavy for it. So this is
  # the one that actually produces an uptime signal.
  - id: site
    type: http_200
    url: https://lanternword.com
  - id: test
    type: command
    run: npm test

setup:
  install: npm ci
  dev_server: npm run dev
  port: 5173

telemetry:
  # HQ pulls pre-aggregated scalars + error events from this Supabase Edge
  # Function (GET ?since=<ISO8601>, Bearer-authed). token_secret names the
  # GitHub secret on dnav-hq/hq that holds the same token as the function's
  # HQ_TELEMETRY_TOKEN Supabase secret on the berean project.
  endpoint: https://dyfyxrcwxyvknupkugiv.supabase.co/functions/v1/hq-telemetry
  token_secret: LANTERN_TELEMETRY_TOKEN
